services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Europe/Paris
      - TELEGRAM_DRY_RUN=${TELEGRAM_DRY_RUN:-true}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
      - ENABLE_FETCH=${ENABLE_FETCH:-true}
      - FETCH_INTERVAL_MIN=${FETCH_INTERVAL_MIN:-15}
      - CACHE_DIR=/data/cache
      - RESULTS_DIR=/data/results
    volumes:
      - ./data:/data
    restart: unless-stopped
