# OB scanner v2 — always-on (live fetch every 15 min + lifecycle refresh)
# Deploy: see DEPLOY_FLY.md. Rollback = PythonAnywhere v2 stays untouched.
app = "ob-scanner-v2"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "Europe/Paris"
  CACHE_DIR = "/data/cache"
  RESULTS_DIR = "/data/results"
  ENABLE_SCHEDULER = "true"
  ENABLE_FETCH = "true"
  FETCH_INTERVAL_MIN = "15"
  FETCH_TFS = "H1"
  FETCH_LIMIT = "300"
  TELEGRAM_DRY_RUN = "true"
  ENABLE_SOFT_REACTION = "true"
  SOFT_REACTION_R = "0.5"
  REACTION_R = "1.0"

# Persistent cache + SQLite (1 GB is plenty: full cache ≈ 10–20 MB)
[mounts]
  source = "ob_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  # Always-on: the scheduler must keep running (no scale-to-zero)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
