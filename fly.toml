# OB scanner — always-on, engine v3 « Kasper » (STRATEGY_V3.md): multi-TF M5…W live fetch + v3 lifecycle
# Deploy: see DEPLOY_FLY.md. Rollback = PythonAnywhere v2 stays untouched.
app = "ob-scanner-v2"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "Europe/Paris"
  CACHE_DIR = "/data/cache"
  RESULTS_DIR = "/data/results"
  ENABLE_SCHEDULER = "true"
  ENABLE_FETCH = "true"
  FETCH_INTERVAL_MIN = "15"
  # Multi-TF scanner: every TF fetched/scanned/tracked at its own cadence (minutes);
  # scheduler ticks every 5 min, H1 processed first.
  FETCH_TFS = "M5,M15,M30,H1,H4,D,W"
  TF_SCHEDULE = "M5:5,M15:15,M30:30,H1:15,H4:60,D:120,W:360"
  CACHE_MAX_BARS = "M1:3000,M5:6000,M15:4000,M30:3000"
  # v3 universe (NQ100 = NAS100 index via Yahoo NQ=F; V3_NQ100_STOCKS=true adds the stocks)
  V3_GROUPS = "METAUX,FOREX,CRYPTO,NQ100"
  V3_NQ100_STOCKS = "false"
  # Telegram alerts per TF (narrow e.g. to "H1" without code change). New TFs are armed
  # after a silent warm-up run: no alerts for zones touched before go-live.
  ALERT_TFS = "M5,M15,M30,H1,H4,D,W"
  FETCH_LIMIT = "300"
  TELEGRAM_DRY_RUN = "true"
  ENABLE_SOFT_REACTION = "false"
  SOFT_REACTION_R = "0.5"
  REACTION_R = "2.0"
  DEFAULT_SCAN_GROUPS = "METAUX,FOREX,CRYPTO"
  DEFAULT_MIN_SCORE = "4"
  # Filtre B hard lock: API/UI/Telegram/stats clamped to groups above + >=4★
  STRATEGY_LOCK = "true"
  ENTRY_MODE = "mid"

# Persistent cache + SQLite (1 GB is plenty: full cache ≈ 10–20 MB)
[mounts]
  source = "ob_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  # Always-on: the scheduler must keep running (no scale-to-zero)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
